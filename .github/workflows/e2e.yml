name: E2E (full Playwright)

# The FULL browser E2E gate on a dedicated, idle GitHub runner — the "genuinely suitable
# idle runner" the load-saturated macOS dev machine cannot provide (PR #24 review). Kept
# out of the fast `ci.yml` gate because it is heavy (~1-3h); it runs on pushes to the
# active feature branch and on demand. Visual-regression screenshots are NOT run here:
# their baselines are macOS-specific and would not match a Linux runner's rendering — the
# visual ×2 gate must run on a macOS host that matches the committed goldens.

# Durable gate: protects master and every PR (not a throwaway feature branch), plus on demand.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      # PR #70 routing: a manual dispatch still runs the FULL gate unless this is explicitly
      # ticked. Nothing else can set it — push and pull_request leave `inputs` null.
      diagnostic:
        description: Run the bounded base-vs-head timing comparison INSTEAD of the full gate
        type: boolean
        required: false
        default: false

concurrency:
  # The diagnostic takes its own group, so it can neither cancel nor be cancelled by an
  # ordinary gate run; ordinary runs keep the previous cancel-in-progress behaviour.
  group: e2e-${{ github.ref }}-${{ (github.event_name == 'workflow_dispatch' && inputs.diagnostic) && 'diagnostic' || 'gate' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic) }}

jobs:
  e2e:
    name: E2E shard ${{ matrix.shard }}
    # Unchanged for push, pull_request and an ordinary manual dispatch; skipped ONLY when a
    # dispatch explicitly asks for the diagnostic.
    if: github.event_name != 'workflow_dispatch' || inputs.diagnostic != true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # 8 parallel shards: keeps each job well under the timeout AND spreads the handful of
        # long soak suites so they can't all land in one shard (round-4 review). Serial per shard.
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium + OS deps
        run: npx playwright install --with-deps chromium

      # HONEST gate: --retries=0 explicitly overrides playwright.config's `retries: CI ? 1 : 0`
      # so a flake can never be masked by a silent CI retry. --workers=1 within each shard.
      # NOTE: some wall-clock-budgeted tests (e.g. the cross-district commute's 380s window)
      # need a FAST host; a free 2-core ubuntu runner can be too slow for those — see the
      # delivery report §7 for the honest per-host picture.
      # `--reporter=list` only replaces CI's default dot reporter, which prints no per-test
      # duration: a timeout was indistinguishable from a test that finished with 1 s to spare.
      # Selection, shards, workers, retries, timeouts and assertions are unchanged.
      - name: E2E shard (workers=1, retries=0)
        run: npx playwright test tests/e2e --workers=1 --retries=0 --reporter=list --shard=${{ matrix.shard }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          # Unique per shard — a shared name collides across the parallel matrix jobs (round-4).
          name: playwright-report-shard-${{ strategy.job-index }}
          # `playwright-report/` is written by the html reporter, which this job does not use, so
          # every failed run uploaded nothing ("No files were found"). The traces the config
          # already keeps (`trace: 'retain-on-failure'`) land in `test-results/` instead, so that
          # path is listed too and a failed shard finally ships the evidence it produced.
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────────────────
  # PR #70 diagnostic — manual dispatch ONLY, never part of the gate.
  #
  # Why it lives here: a standalone workflow file cannot be dispatched until it is registered
  # on the default branch, and this one is already registered. Routing through it needs no
  # merge. The gate job above is untouched for push, pull_request and ordinary dispatch.
  #
  # What it answers: the 12 test identities that failed at be9bf6e (run 37993232639) but not at
  # 0e514b8 (run 36073632407). Each runs once per revision (24 executions) on ONE runner, paired back
  # to back with the first revision alternating, 1 worker, 0 retries, unchanged assertions/timeouts/
  # test code, traces kept for every outcome. Selection is by exact full title (four parameterized
  # tests share asset-integration-wave-4.spec.ts:345) and is verified on both revisions first.
  # The job's own conclusion reflects only VALIDITY (pins, identical inputs, selection, 24 results);
  # test outcomes are data, recorded in results.tsv and the step summary.
  # ─────────────────────────────────────────────────────────────────────────────────────────
  diagnostic:
    name: Diagnostic — PR70 12 head-only failures, 0e514b8 vs be9bf6e, paired
    if: github.event_name == 'workflow_dispatch' && inputs.diagnostic == true
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      # BASE = PR70 before the interior-shadow fix; HEAD = PR70's current head (only the fix on top).
      BASE_SHA: 0e514b8130fa008038854ac23dda2b223ea6b1d6
      HEAD_SHA: be9bf6e3b77f893cdf7611e750d4098cc2d813dd
    steps:
      - name: Check out the diagnostic scripts (this branch)
        uses: actions/checkout@v4
        with:
          path: diag
          persist-credentials: false

      - name: Check out the base revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false

      - name: Check out the head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false

      - name: Set up Node (pinned via head's .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: head/.nvmrc

      - name: Verify the checkouts and the identical test/dependency inputs (stops on mismatch)
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          {
            echo "expected base: $BASE_SHA"; echo "actual   base: $(git -C base rev-parse HEAD)"
            echo "expected head: $HEAD_SHA"; echo "actual   head: $(git -C head rev-parse HEAD)"
            echo "diag branch commit: $(git -C diag rev-parse HEAD)"
          } | tee evidence/pins.txt
          test "$(git -C base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C head rev-parse HEAD)" = "$HEAD_SHA"
          for f in package-lock.json package.json .nvmrc playwright.config.ts; do
            cmp "base/$f" "head/$f" && echo "same      $f" | tee -a evidence/pins.txt
          done
          diff -r base/tests head/tests && echo "same      tests/ (entire tree)" | tee -a evidence/pins.txt

      - name: Install dependencies for both revisions
        run: |
          set -Eeuo pipefail
          (cd base && npm ci)
          (cd head && npm ci)
          base_v="$(cd base && npx playwright --version)"; head_v="$(cd head && npx playwright --version)"
          echo "base playwright: $base_v" | tee -a evidence/pins.txt
          echo "head playwright: $head_v" | tee -a evidence/pins.txt
          test "$base_v" = "$head_v"

      - name: Install the Playwright browser once (one binary, shared by both sides)
        run: cd head && npx playwright install --with-deps chromium

      - name: Record the runner environment
        run: |
          {
            echo "date: $(date -u +%FT%TZ)"
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            echo "runner nproc: $(nproc)"
            echo "runner cpu: $(grep -m1 'model name' /proc/cpuinfo || true)"
            echo "runner loadavg at start: $(cat /proc/loadavg)"
            echo "runner memory:"; free -m
          } | tee evidence/runner.txt

      - name: Run the 12 paired comparisons (24 executions)
        run: |
          set -Eeuo pipefail
          bash diag/.github/diagnostics/run-pairs.sh diag/.github/diagnostics/pr70-12.tsv \
            "$GITHUB_WORKSPACE/base" "$GITHUB_WORKSPACE/head" "$GITHUB_WORKSPACE/evidence" 2>&1 | tee evidence/pairs.log
          echo "runner loadavg at end: $(cat /proc/loadavg)" >> evidence/runner.txt

      - name: Upload the evidence (traces for every outcome)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr70-12-paired-diagnostic
          path: evidence/
          retention-days: 7

      - name: Verify completeness and write the summary
        if: always()
        run: |
          set -Eeuo pipefail
          n=$(( $(wc -l < evidence/results.tsv 2>/dev/null || echo 1) - 1 ))
          traces=$(find evidence/base evidence/head -name trace.zip 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "# PR70 — 12 head-only failures, paired 0e514b8 vs be9bf6e"
            echo; echo "executions: $n (expected 24) · traces: $traces"
            echo; echo '```'; cat evidence/runner.txt; echo '```'
            echo; echo '```'; column -t -s $'\t' evidence/results.tsv | cut -c1-260; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$n" = 24 ] || { echo "::error::expected 24 executions, got $n"; exit 1; }
