name: E2E (full Playwright)

# The FULL browser E2E gate, split into two partitions so the timing/soak suites stop failing on the
# render-starved CI runner (see docs/e2e-simulation-only.md + the render-suppression proof):
#   • normal-render     — pixel-dependent tests (draw calls, GLB/model, occlusion), NORMAL WebGL.
#   • simulation-only    — @simulation-only tests whose verdict is pixel-independent; drawing is
#                          suppressed after settle so the single useFrame authority runs near real
#                          time (test bodies, assertions and timeouts UNCHANGED; retries=0).
# MEASURED runner (not assumed): a standard public runner was AMD EPYC 9V74, 4 logical vCPU, 16 GB,
# Ubuntu 24.04 (Azure), rendering WebGL via SwiftShader (software) — NOT the stale "free 2-core"
# note, and GitHub may change the exact CPU model at any time. Visual-regression screenshots are NOT
# run here (macOS-specific baselines).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- deterministic partition accounting: 325 + 42 = 367, empty intersection, complete union ----
  accounting:
    name: partition accounting (exact-once)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exact-once partition check
        run: node scripts/e2e-partition-check.mjs 367

  # ---- normal-render partition: NO suppression, sharded (2). Render-sensitive tests only. ----
  normal-render:
    name: normal-render ${{ matrix.shard }}
    needs: accounting
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Normal-render partition (NO suppression, workers=1, retries=0)
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=pw-results.json \
            npx playwright test tests/e2e --grep-invert "@simulation-only" \
            --workers=1 --retries=0 --forbid-only \
            --reporter=line,json,html --shard=${{ matrix.shard }} || true
          # The exit code alone is not trusted: assert the JSON report is clean (0 failed/skipped/flaky, >0 ran).
          node scripts/assert-playwright-run.mjs pw-results.json "normal-render ${{ matrix.shard }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-normal-${{ strategy.job-index }}
          path: |
            playwright-report/
            pw-results.json
          retention-days: 7

  # ---- simulation-only partition: suppression enabled after settle, sharded (4). ----
  simulation-only:
    name: simulation-only ${{ matrix.shard }}
    needs: accounting
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      # Auto-engage render suppression after asset/scene settle. This env is used ONLY here, paired
      # with the @simulation-only filter — never with the unfiltered suite (see the guard tests).
      VITE_SUPPRESS_AFTER_SETTLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Simulation-only partition (render-suppressed, workers=1, retries=0)
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=pw-results.json \
            npx playwright test tests/e2e --grep "@simulation-only" \
            --workers=1 --retries=0 --forbid-only \
            --reporter=line,json,html --shard=${{ matrix.shard }} || true
          # The exit code alone is not trusted: assert the JSON report is clean (0 failed/skipped/flaky, >0 ran).
          node scripts/assert-playwright-run.mjs pw-results.json "simulation-only ${{ matrix.shard }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-simulation-${{ strategy.job-index }}
          path: |
            playwright-report/
            pw-results.json
          retention-days: 7

  # ---- fail-closed conclusion: any partition/accounting failure OR cancellation fails the gate. ----
  conclusion:
    name: E2E gate conclusion
    needs: [accounting, normal-render, simulation-only]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every partition to have succeeded (no cancel / skip / failure)
        run: |
          echo "accounting=${{ needs.accounting.result }} normal=${{ needs.normal-render.result }} simulation=${{ needs.simulation-only.result }}"
          for r in "${{ needs.accounting.result }}" "${{ needs.normal-render.result }}" "${{ needs.simulation-only.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::E2E gate FAILED — a partition result was '$r' (not success)"; exit 1; fi
          done
          echo "E2E gate PASS — both partitions succeeded, accounting exact-once."
