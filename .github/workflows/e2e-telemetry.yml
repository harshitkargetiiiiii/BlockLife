name: E2E environment telemetry (diagnostic)

# Branch-scoped diagnostic ONLY. Runs for the telemetry-probe branch and on manual dispatch.
# It does NOT touch or replace the full E2E gate (e2e.yml), and it runs a single bounded job —
# no 8-shard matrix. Public repo → standard free runner only (never a paid larger runner).
on:
  push:
    branches: [e2e-ci-telemetry-probe]
  workflow_dispatch:

concurrency:
  group: e2e-telemetry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  telemetry:
    name: E2E environment telemetry (1 job, workers=1, retries=0)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium + OS deps
        run: npx playwright install --with-deps chromium

      - name: Record runner hardware telemetry
        run: |
          mkdir -p diagnostics-output
          {
            echo "== captured (UTC) =="; date -u
            echo "== logical processors (nproc) =="; nproc
            echo "== lscpu =="; lscpu || true
            echo "== memory (/proc/meminfo, first 5) =="; head -5 /proc/meminfo || true
            echo "== os / kernel =="; uname -a; ( . /etc/os-release && echo "$PRETTY_NAME" ) || true
            echo "== load / uptime =="; uptime || true
            echo "== virtualization =="; systemd-detect-virt || true
            echo "== node =="; node -v
            echo "== playwright =="; npx playwright --version
            echo "== chromium binary =="; "$(node -e "console.log(require('playwright').chromium.executablePath())")" --version 2>/dev/null || true
          } | tee diagnostics-output/runner-hardware.txt

      - name: A/B render-suppression proof (single spec, NO 8-shard suite)
        run: npx playwright test tests/diagnostics/e2e-environment.spec.ts --workers=1 --retries=0

      # Only reached if the A/B proof PASSED (a failed step stops the job). Runs the EXACT existing
      # recurring CI failure — original body, assertions and 420s timeout, retries=0 — with the app
      # auto-suppressing rendering AFTER assets settle (VITE_SUPPRESS_AFTER_SETTLE). A pass here means
      # the unchanged assertions are satisfied through REAL domain progress, not by hiding gameplay.
      - name: Existing failing test under render suppression (unchanged assertions)
        env:
          VITE_SUPPRESS_AFTER_SETTLE: '1'
        run: npx playwright test tests/e2e/citizen-destinations.spec.ts -g "yard worker completes a cross-district commute" --workers=1 --retries=0

      - name: Upload telemetry (browser JSON + runner hardware, report only if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-environment-telemetry
          path: |
            diagnostics-output/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn
